name: Plugin package

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: npm test
      - run: npm run check-plugin-version
      - run: npm run check-plugin-package

  codex-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        codex-version: ["0.160.1", "latest"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install isolated Codex compatibility tool
        env:
          CODEX_VERSION: ${{ matrix.codex-version }}
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-tool" --ignore-scripts --no-audit --no-fund --package-lock=false "@openai/codex@$CODEX_VERSION"
          echo "CODEX_BIN=$RUNNER_TEMP/codex-tool/node_modules/.bin/codex" >> "$GITHUB_ENV"
      - run: npm run check-plugin-package
      - run: npm run test-codex-plugin
